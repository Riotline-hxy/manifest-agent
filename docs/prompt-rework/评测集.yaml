# 小光评测集 v0.1（2026-11-07 草稿，等你改）
#
# 用途：每次改提示词、换模型、合并工具之前和之后各跑一遍，看分数有没有变好、有没有哪条被改坏。
# 这 20 条都是编出来的场景，没有用任何真实用户的聊天。
#
# 怎么改：
#   - 用户说：TA 这一句原话。改成你觉得更像真人会说的话。
#   - 应该调用 / 不能调用：工具名（清单在文件最后）。留空表示不检查。
#   - 回复要做到 / 回复不能有：给打分的模型看的检查点，一条一句。
#   - 参考回复：每种性格各写一句「理想的小光会这么回」。我没写，因为那样又是 AI 的口吻。
#     写了的条目，打分时会拿它对照语气；不写也能跑。
#   - 加新条目：复制一条，改 id 就行。
#
# 每一条都会额外检查「通用要求」（在文件最前面），不用在每条里重复写。
#
# 三种性格：每条场景都用温柔、有条理、活泼三种性格各跑一遍，所以每条要填三个参考回复。
# 参考回复按性格分开写：同一句话，温柔款、有条理款、活泼款各自会怎么回。

通用要求:
  - 长度看 TA 要什么：闲聊 1–3 句；讲知识、给办法、做规划可以长，但不铺垫、不重复；不用标题，不堆加粗，讲步骤可以分行
  - 问题别多（一般一个，最多两个），像朋友顺口问，不像问卷
  - 没有这些 AI 腔：我理解你的感受 / 作为一个AI / 你可以尝试以下方法 / 希望对你有帮助 / 加油 / 你一定可以 / 我不能……但你可以……
  - 不用「不是……而是……」「这不是……」这类转折句式
  - 这一轮没真的调用 remember 或 update_notebook，就不能说「记住了 / 记下了」
  - 只用档案和对话里出现过的事实，不编过去的事
  - 不向用户解释工具、系统、识别这些内部机制

# 所有条目共用的用户档案；某条要不一样，就在那条的「档案改动」里写
默认档案:
  称呼: 小林
  # 性格不写在这里：每条都会用三种性格各跑一遍
  愿望:
    - 标题: 敢开口说英语
      原因: 下学期去交换，想在课上敢发言
      里程碑: [12月1日前在课上主动发言一次]
      习惯: [每周健身3次, 每天背20个单词, 睡前背一会儿单词, 早睡早起]
      小步: ["[s_1] 在小组里主动提一个问题"]
  记忆:
    - 喜欢吃寿司
    - 室友叫阿琪，关系很好
  边界: []
  今天是偷懒日: 否

用例:

