# 小光评测集 · 功能与记忆 v0.1（2026-11-07）
#
# 第一份评测集（评测集.yaml）测人味和常用工具；这一份补两块：
#   一、App 里每个功能：问它是什么 / 在哪，或者让小光直接去做
#   二、记忆：能不能读出来用上、该记的记、不该记的不记、不重复记、守住边界
# 参考回复都留空了，你想写可以照第一份的格式填三种性格；不写也能跑。
# 「前情」是这句话之前已经发生的对话（按顺序），用来测「小光刚问过，TA 说好」这类情况。
# 跑法：python tools/eval_xiaoguang.py --file 评测集-功能与记忆.yaml --label 功能与记忆

通用要求:
  - 像微信聊天：一般 1–3 句，不用标题、列表、加粗
  - 问题别多（一般一个，最多两个），像朋友顺口问，不像问卷
  - 没有 AI 腔（我理解你的感受 / 作为一个AI / 希望对你有帮助 / 加油 / 你一定可以）
  - 讲功能时只说 App 里真有的东西，按钮名、位置、规则照说明书，不编
  - 只用档案、记忆和对话里出现过的事实，不编过去的事
  - 没真的调用工具，就不能说已经做好了

默认档案:
  称呼: 小林
  愿望:
    - 标题: 敢开口说英语
      原因: 下学期去交换，想在课上敢发言
      里程碑: [12月1日前在课上主动发言一次]
      习惯: [每周健身3次, 每天背20个单词]
      小步: ["[s_1] 在小组里主动提一个问题"]
  记忆:
    - 不吃香菜
    - 室友叫阿琪，关系很好
    - 下学期去英国交换
  边界: []
  今天是偷懒日: 否

用例:

# ---------- 一、功能：问是什么 / 在哪 ----------

  - id: F01
    场景: 问蜕变报告在哪
    用户说: 蜕变报告在哪里看啊
    不能调用: [start_scene]
    回复要做到:
      - 说清在蜕变计划页最底下
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: F02
    场景: 问两分钟启动是什么（只是问，没说要用）
    用户说: 点子里那个两分钟启动是干嘛的
    不能调用: [start_scene]
    回复要做到:
      - 说清是把开始不了的事拆成几个一两分钟的小动作，小光陪着一步一步做
      - 最多问一句要不要试试，不直接打开
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: F03
    场景: 问能不能自己删小步
    用户说: 小步在页面上能删吗
    回复要做到:
      - 照实说页面上不能删、不能改名，可以让小光来删
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: F04
    场景: 问每日任务的规则
    用户说: 每日任务做满了能拿多少金币
    应该调用: [get_growth]
    回复要做到:
      - 数字来自工具返回，不编
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

# ---------- 二、功能：直接去做 ----------

  - id: F05
    场景: 改小镇名字
    用户说: 我的小镇就叫星星镇吧
    应该调用: [update_settings]
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: F06
    场景: 改称呼
    用户说: 以后叫我林林吧
    应该调用: [update_settings]
    回复要做到:
      - 回复里就用上「林林」
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: F07
    场景: 主动消息调少
    用户说: 你主动找我的次数少一点吧，最近有点忙
    应该调用: [update_settings]
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: F08
    场景: 新开一个愿望
    用户说: 再开一个愿望吧：学会弹吉他
    应该调用: [edit_plan]
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: F09
    场景: 改一个小步的名字
    用户说: 把「在小组里主动提一个问题」改成「在课上主动提一个问题」
    应该调用: [edit_plan]
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: F10
    场景: 加习惯
    用户说: 帮我加个习惯，每周跑步两次
    应该调用: [add_habit]
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: F11
    场景: 查自己的打卡记录
    用户说: 我这周健身打了几次卡来着
    应该调用: [look_up]
    回复要做到:
      - 用查到的真实次数，不编
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: F12
    场景: 学堂找文章
    用户说: 心灵学堂里有讲拖延的文章吗
    应该调用任一: [knowledge_search, look_up]
    回复要做到:
      - 只说查到的；查不到就照实说
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: F13
    场景: 点名做感恩练习
    用户说: 来做个三分钟感恩吧
    应该调用: [start_scene]
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: F14
    场景: 问以前的两分钟启动经历（没有记录）
    用户说: 上次我用两分钟启动是怎么开始的来着
    应该调用: [kick_history]
    回复要做到:
      - 没有记录就照实说，并说明勾了「让小光记住这次体验」才会留下
    回复不能有:
      - 编一段以前的经历
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

# ---------- 三、记忆：读 ----------

  - id: M01
    场景: 用记忆里的偏好（没提香菜，小光要自己想起来）
    用户说: 晚上想点外卖，你帮我想想吃啥
    不能调用: [remember]
    回复要做到:
      - 推荐的东西避开香菜，或者顺口提一句记得 TA 不吃香菜
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: M02
    场景: 问记不记得一个人
    用户说: 你还记得我室友叫什么吗
    回复要做到:
      - 说出阿琪，不编别的细节
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: M03
    场景: 守住边界
    档案改动:
      边界: [别跟我聊体重和减肥]
    用户说: 最近健身好累啊，练了这么久感觉也没什么变化
    回复不能有:
      - 体重、减肥、瘦了没瘦这类话
    回复要做到:
      - 接住累和泄气
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

# ---------- 四、记忆：写 ----------

  - id: M04
    场景: 让记一件带日期的事
    用户说: 你记一下，我生日是 12 月 15 号
    应该调用: [remember]
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: M05
    场景: 小光刚问过要不要记，TA 说好
    前情:
      - {用户: 我对芒果过敏，吃了会起疹子}
      - {小光: 啊，那可得小心，芒果味的零食也躲着点。要我帮你记下来吗？}
    用户说: 好呀
    应该调用: [remember]
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: M06
    场景: 随口提到别人的事，没让记
    用户说: 对了阿琪下周过生日，我还没想好送啥
    不能调用: [remember, update_notebook]
    回复要做到:
      - 帮着想想送什么，或者问问阿琪喜欢什么
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: M07
    场景: 交换的地方变了，要更正
    用户说: 跟你说下，交换的学校最后换成澳洲的了，不去英国了
    应该调用: [correct_memory]
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

# ---------- 五、小步别打错勾（2026-11-07 补） ----------

  - id: M08
    场景: 做成了一件和某个小步很像、但不是同一件的事（以前会被错记成完成了「在小组里提问」）
    用户说: 刚才我第一次在课上举手用英语回答了老师的问题，心跳特别快，但答对了
    不能调用: [complete_step]
    回复要做到:
      - 接住这件事，可以问要不要留在轨迹上，或者问一句是不是就是小组提问那一步
    参考回复: {温柔: "", 有条理: "", 活泼: ""}

  - id: M09
    场景: 明确说某一步做完了（要照样打勾）
    用户说: 小组里主动提问那一步我做完啦
    应该调用: [complete_step]
    参考回复: {温柔: "", 有条理: "", 活泼: ""}
