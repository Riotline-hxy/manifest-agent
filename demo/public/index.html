<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="显伴 · 小光——把想成为的人，收成今天的一小步。">
  <title>显伴 · 小光</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="components.css">
</head>
<body>
  <!-- logged-out -->
  <main id="gate" class="gate" hidden>
    <section class="gate-hero">
      <div class="gate-orb" id="gateOrb" aria-hidden="true"></div>
      <h1 class="gate-title">把想成为的人，<br>收成今天的一小步。</h1>
      <p class="gate-sub">显伴是一个显化陪伴 agent。它记得你说过的话，陪你一点点靠近自己想要的样子。</p>
      <div class="gate-actions">
        <button class="btn btn-ink btn-lg" data-act="guest">先体验一下</button>
        <button class="btn btn-ghost btn-lg" data-act="show-auth" data-mode="login">登录</button>
      </div>
      <p class="gate-fine">体验账号会预置 12 天的示例记录，只属于你这个浏览器。想留下来，随时可以注册。</p>
    </section>
    <form class="auth" id="authForm" hidden novalidate>
      <h2 id="authTitle">登录</h2>
      <label>用户名<input name="username" autocomplete="username" required minlength="2" maxlength="20"></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required minlength="6"></label>
      <p class="auth-err" id="authErr" role="alert"></p>
      <button class="btn btn-ink" type="submit" id="authSubmit">登录</button>
      <button class="link" type="button" data-act="toggle-auth" id="authToggle">还没有账号？注册</button>
      <button class="link muted" type="button" data-act="hide-auth">返回</button>
    </form>
  </main>

  <!-- onboarding -->
  <main id="onboard" class="onboard" hidden></main>

  <!-- app -->
  <div id="app" class="app" hidden>
    <nav class="rail" id="rail" aria-label="主导航"></nav>
    <main class="stage" id="stage"></main>
    <aside class="side" id="side" aria-label="今天"></aside>
    <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>
  <div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/emotion-ball/js/rings.js"></script>
  <script src="vendor/emotion-ball/js/emotions.js"></script>
  <script src="vendor/emotion-ball/js/ball.js"></script>
  <script src="vendor/emotion-ball/js/engine.js"></script>
  <script src="vendor/html2canvas/html2canvas.min.js" defer></script>
  <script src="orb.js"></script>
  <script src="app.js"></script>
</body>
</html>
